[project]
name = "myfood"
version = "0.1.0"
description = "MyFood backend — FastAPI, motor de dietas, iafood"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "cryptography>=43.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "email-validator>=2.2",
  "pywebpush>=2.0",
  "pulp>=2.8",
  "claude-agent-sdk>=0.2.152",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) en argumentos por defecto es el idiom de FastAPI

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # DDL embebido — no se envuelve línea a línea

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Un único event loop para toda la sesión de tests: el engine async de
# SQLAlchemy es un singleton a nivel de módulo (db/session.py) y su pool de
# conexiones asyncpg se rompe si distintos tests usan loops distintos.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myfood"]
