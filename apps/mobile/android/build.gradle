// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // 2.2.21, no una versión más antigua: kotlinx-coroutines-android
    // 1.11.0 (usada por el plugin de Health Connect) trae metadatos
    // compilados con Kotlin 2.2 — un compilador más antiguo no puede
    // leerlos ("Module was compiled with an incompatible version").
    ext.kotlin_version = '2.2.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Health Connect (Fase 6) — su SDK expone `suspend fun`, muy
        // incómodo de invocar desde Java sin este plugin.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
