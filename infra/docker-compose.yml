services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - ./data/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      retries: 5

  api:
    build: ../apps/api
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/apps/propias-app/myfood/data/images:/data/images
      - /var/apps/propias-app/myfood/data/config:/data/config
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      retries: 5

  worker:
    build: ../apps/api
    restart: unless-stopped
    command: python -m myfood.worker
    env_file: .env
    volumes:
      - /var/apps/propias-app/myfood/data/images:/data/images
      - /var/apps/propias-app/myfood/data/config:/data/config
    depends_on:
      api: { condition: service_healthy }

  # Transcripción de voz autoalojada (Fase 8, sección 24.1) — única IA local
  # del proyecto, no razona, solo convierte audio en texto (R2). Imagen sin
  # GPU por defecto para que `docker compose up` funcione en cualquier host
  # sin más requisitos; en un host con `nvidia-container-toolkit` operativo,
  # usar la GPU con:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
  # (criterio de aceptación de la Fase 8: funciona con GPU si está
  # disponible, y en modo CPU si no — ver docker-compose.gpu.yml).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-medium}
    volumes:
      - /var/apps/propias-app/myfood/data/whisper:/root/.cache/whisper
    healthcheck:
      # El servicio no expone una ruta de salud dedicada — /docs (Swagger,
      # generado automáticamente por FastAPI) sirve igual para comprobar que
      # el proceso responde, y no requiere subir audio de prueba.
      test: ["CMD", "curl", "-f", "http://localhost:9000/docs"]
      interval: 30s
      retries: 5
      start_period: 120s

  web:
    build: ../apps/web
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    depends_on:
      api: { condition: service_healthy }
